name: Build Windows app

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: FireProtectionDigitalTwin-Windows
          path: |
            release/*.exe
          if-no-files-found: error
      - name: Attach installers to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
      - name: Publish to the public download page (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: node tools/publish-release.mjs
